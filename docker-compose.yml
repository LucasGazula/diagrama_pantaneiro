services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_LIFETIME_SECONDS=${JWT_LIFETIME_SECONDS:-900}
      - REFRESH_LIFETIME_SECONDS=${REFRESH_LIFETIME_SECONDS:-2592000}
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-false}
      - BRAPI_TOKEN=${BRAPI_TOKEN:-}
      - TIMEZONE=America/Sao_Paulo
    volumes:
      - backend_data:/app/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    image: diagrama-cerrado-frontend:latest
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
